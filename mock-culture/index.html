	// 코드 블록의 복사 버튼: 같은 블록의 코드를 복사한다.
	// 복사한 직후 잠깐 data-copied를 붙여, 아이콘이 체크 표시로 바뀌게 한다.
	document.querySelectorAll('[data-copy]').forEach((button) => {
		button.addEventListener('click', async () => {
			const code = button.closest('figure')?.querySelector('pre code');
			try {
				await navigator.clipboard.writeText(code?.innerText ?? '');
				button.setAttribute('data-copied', '');
				button.setAttribute('aria-label', '복사됨');
				setTimeout(() => {
					button.removeAttribute('data-copied');
					button.setAttribute('aria-label', '코드 복사');
				}, 1500);
			} catch {}
		});
	});

	// 공유하기: 기기의 공유 기능이 있으면 열고, 없으면 글 주소를 복사한다.
	document.querySelectorAll('[data-share]').forEach((button) => {
		const label = button.querySelector('[data-share-label]');
		button.addEventListener('click', async () => {
			const url = location.href.split('#')[0];
			try {
				if (navigator.share) {
					await navigator.share({ title: document.title, url });
					return;
				}
				await navigator.clipboard.writeText(url);
				if (label) {
					label.textContent = '링크를 복사했습니다';
					setTimeout(() => (label.textContent = '공유하기'), 1800);
				}
			} catch {}
		});
	});
</script>
